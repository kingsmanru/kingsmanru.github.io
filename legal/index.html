<script>
/* Rendu des pages légales (contenu bilingue intégré) */
document.addEventListener("DOMContentLoaded", function () {
  KO.pages.legal = function () {
    const id = KO.param("id") || "conditions";
    const doc = window.KO_LEGAL[id];
    if (!doc) { location.href = "/"; return; }
    const lang = window.KO.lang === "en" ? "en" : "fr";
    document.title = doc.titre[lang] + " — Kingsman Odyssey";
    KO.qs("#legalTitle").textContent = doc.titre[lang];
    KO.qs("#legalMaj").textContent = (lang === "en" ? "Updated: " : "Mis à jour : ") + doc.maj;
    KO.qs("#legalTabs").innerHTML = [["conditions", "Conditions d’utilisation"], ["confidentialite", "Politique de confidentialité"], ["mentions", "Mentions légales"]]
      .map(function (t) {
        return '<a class="pill ' + (t[0] === id ? "active" : "") + '" href="/legal/?id=' + t[0] + '">' +
          window.KO_LEGAL[t[0]].titre[lang] + "</a>";
      }).join("");
    KO.qs("#legalBody").innerHTML = doc.sections.map(function (sec) {
      return "<h3>" + KO.esc(sec.h[lang]) + "</h3><p>" + KO.esc(sec.p[lang]) + "</p>";
    }).join("");
    if (window.KO.seoDynamic) {
      window.KO.seoDynamic("https://www.kingsmanodyssey.ru/legal/?id=" + id, document.title);
    }
  };
  /* layout.js a déjà déclenché le rendu de page avant cette définition :
     on appelle le rendu directement (le DOM est prêt) */
  try { KO.pages.legal(); } catch (e) { console.error(e); }
});
</script>
